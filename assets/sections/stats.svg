<svg xmlns="http://www.w3.org/2000/svg" width="720" height="64" viewBox="0 0 720 64" role="img" aria-label="top --user tavoMend">
<style>
  text { font-family: 'Fira Code','JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace; font-size: 18px; font-weight: 700; }
  .idx { fill: #0d4d45; font-size: 13px; letter-spacing: 2px; }
  .pr { fill: #00c896; }
  .cmd { fill: #00e5ff; clip-path: inset(0 100% 0 0); animation: type 1.2s steps(19) .3s forwards; }
  .cur { fill: #00ff9c; animation: blink 1s steps(1) infinite; }
  .rule { stroke: #0d4d45; stroke-dasharray: 2 5; }
  @keyframes type { to { clip-path: inset(0 0 0 0); } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cmd, .cur { animation: none; clip-path: none; } }
</style>
<rect x=".5" y=".5" width="719" height="63" rx="10" fill="#020a09" stroke="#0d4d45"/>
<text class="idx" x="22" y="38">[0x04]</text>
<text class="pr" x="96" y="39">~ $</text>
<text class="cmd" x="146" y="39" textLength="205" lengthAdjust="spacing">top --user tavoMend</text>
<rect class="cur" x="359" y="24" width="10" height="19"/>
</svg>
